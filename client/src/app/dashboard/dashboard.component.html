<div class="dashboard">
    <app-user-list (userSelected)="onUserSelected($event)"></app-user-list>

    <div class="dashboard__main">
        <app-user-detail-card [user]="selectedUser()"></app-user-detail-card>

        @if (selectedUser(); as u) {
        <app-create-post-form [userId]="u.id"></app-create-post-form>
        }

        <app-post-feed [userId]="selectedUser()?.id ?? null"></app-post-feed>
    </div>
</div>
