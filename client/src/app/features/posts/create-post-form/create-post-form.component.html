<form class="create-post-form" [formGroup]="form" (ngSubmit)="submit()">
    <h3>New Post</h3>

    <div class="field">
        <label for="title">Title</label>
        <input id="title" type="text" formControlName="title"
            [attr.aria-invalid]="form.get('title')?.invalid && form.get('title')?.touched" />
        @if (form.get('title')?.touched && form.get('title')?.errors) {
        <p class="field__error" role="alert">Title is required.</p>
        }
    </div>

    <div class="field">
        <label for="body">Body</label>
        <textarea id="body" rows="3" formControlName="body"
            [attr.aria-invalid]="form.get('body')?.invalid && form.get('body')?.touched"></textarea>
        @if (form.get('body')?.touched && form.get('body')?.errors) {
        <p class="field__error" role="alert">Body is required.</p>
        }
    </div>

    @if (serverError()) {
    <p class="field__error" role="alert">{{ serverError() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Posting…' : 'Post' }}
    </button>
</form>
