<form class="create-post-form" [formGroup]="form" (ngSubmit)="submit()"
    [class.create-post-form-collapsed]="!isExpanded()" (click)="expandForm()">

    <div class="create-post-form-trigger-header">
        @if (!isExpanded()) {
        <span class="prompt-text">Write a new post...</span>
        } @else {
        <h3>New Post</h3>
        }
    </div>

    <div class="create-post-form-content" (click)="$event.stopPropagation()">
        @if (serverError()) {
        <div class="error-banner" role="alert">
            {{ serverError() }}
        </div>
        }

        <div class="field">
            <label for="title">Title</label>
            <input id="title" type="text" formControlName="title" [class.field-invalid]="isInvalid('title')"
                [attr.aria-invalid]="isInvalid('title')" />
            @if (errorMessage('title'); as msg) {
            <span class="error-text" role="alert">{{ msg }}</span>
            }
        </div>

        <div class="field">
            <label for="body">Body</label>
            <textarea id="body" rows="3" formControlName="body" [class.field-invalid]="isInvalid('body')"
                [attr.aria-invalid]="isInvalid('body')"></textarea>
            @if (errorMessage('body'); as msg) {
            <span class="error-text" role="alert">{{ msg }}</span>
            }
        </div>


        <div class="form-actions">
            <button type="button" class="cancel-btn" (click)="collapseForm($event)">Cancel</button>
            <button type="submit" class="submit-btn" [disabled]="submitting()">
                @if (submitting()) {
                <span class="spinner" aria-hidden="true"></span>
                <span>Posting…</span>
                } @else {
                <span>Post</span>
                }
            </button>
        </div>
    </div>
</form>
